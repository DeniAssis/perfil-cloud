<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#00051E;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#00FFC4;text-decoration:none}a:hover{color:#00FF95;text-decoration:underline}
input::placeholder{color:#7D8BA8}
</style>
</helmet>
<main data-screen-label="01 Start" style="position:relative;min-height:100vh;overflow:hidden;background:linear-gradient(160deg,#02122C 0%,#00051E 55%,#010E20 100%);display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:clamp(32px,6vh,64px) 24px clamp(170px,24vh,240px)">

  <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:clamp(150px,22vh,230px);pointer-events:none;opacity:0.5">
    <div style="position:absolute;right:6%;bottom:40px;display:flex;align-items:flex-end;gap:6px">
      <div style="width:28px;height:60px;background:#0A1F3D;border:1px solid #183C78;border-bottom:none;border-radius:3px 3px 0 0"></div>
      <div style="width:40px;height:110px;background:#0A1F3D;border:1px solid #183C78;border-bottom:none;border-radius:3px 3px 0 0"></div>
      <div style="width:24px;height:80px;background:#0A1F3D;border:1px solid #183C78;border-bottom:none;border-radius:3px 3px 0 0"></div>
      <div style="width:46px;height:140px;background:#0A1F3D;border:1px solid #183C78;border-bottom:none;border-radius:3px 3px 0 0"></div>
      <div style="width:30px;height:70px;background:#0A1F3D;border:1px solid #183C78;border-bottom:none;border-radius:3px 3px 0 0"></div>
    </div>
    <div style="position:absolute;left:-10%;bottom:-60%;width:45%;aspect-ratio:1.5;border-radius:50%;background:#010C20;border-top:2px solid rgba(0,180,144,0.7);box-shadow:0 -12px 40px rgba(0,180,144,0.18)"></div>
    <div style="position:absolute;left:25%;bottom:-75%;width:40%;aspect-ratio:1.6;border-radius:50%;background:#010C20;border-top:2px solid rgba(0,132,132,0.6);box-shadow:0 -10px 36px rgba(0,132,132,0.15)"></div>
    <div style="position:absolute;right:-12%;bottom:-55%;width:42%;aspect-ratio:1.4;border-radius:50%;background:#010C20;border-top:2px solid rgba(0,180,144,0.6);box-shadow:0 -12px 40px rgba(0,180,144,0.16)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,rgba(0,5,30,0) 0%,#00051E 100%)"></div>
  </div>

  <div style="position:relative;z-index:1;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(28px,5vh,48px)">
    <img src="assets/logo-tcb.svg" alt="The Cloud Bootcamp" style="height:clamp(56px,8vw,76px);width:auto;display:block">

    <div style="display:flex;flex-direction:column;align-items:center;gap:20px">
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap">
        <span style="font-size:clamp(12px,1.6vw,15px);font-weight:600;letter-spacing:0.22em;color:#FFFFFF">HANDS-ON PROJECT DAY</span>
        <span style="width:2px;height:16px;background:#00FFC4"></span>
        <span style="font-family:Sora,Inter,sans-serif;font-size:clamp(13px,1.7vw,16px);font-weight:700;letter-spacing:0.14em;color:#00FFC4">2026</span>
      </div>
      <h1 style="margin:0;font-family:Sora,Inter,sans-serif;font-weight:800;font-size:clamp(38px,7vw,72px);line-height:1.05;letter-spacing:-0.02em;text-wrap:balance">Welches Cloud-Profil bist du?</h1>
      <p style="margin:0;max-width:440px;font-size:clamp(16px,2vw,19px);line-height:1.55;color:#A9B6D0;text-wrap:balance">8 Fragen, weniger als 3 Minuten.<br>Es gibt keine richtigen oder falschen Antworten.</p>
    </div>

    <form onSubmit="{{ onSubmit }}" style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;text-align:left">
      <label for="name" style="font-size:12px;font-weight:600;letter-spacing:0.22em;color:#A9B6D0">VOR- UND NACHNAME</label>
      <input id="name" type="text" autocomplete="name" placeholder="z. B. Denise Assis" value="{{ name }}" onChange="{{ onName }}" style="height:56px;padding:0 18px;border-radius:12px;background:#0A1F3D;border:1px solid rgba(255,255,255,0.08);color:#FFFFFF;font:500 17px Inter,system-ui,sans-serif;outline:none;box-sizing:border-box" style-focus="border-color:#00FF95;box-shadow:0 0 0 3px rgba(0,255,149,0.15)">
      <button type="submit" disabled="{{ disabled }}" style="height:56px;margin-top:4px;border:1px solid {{ btnBorder }};border-radius:12px;background:{{ btnBg }};color:{{ btnFg }};font:600 17px Inter,system-ui,sans-serif;cursor:{{ btnCursor }};transition:box-shadow .2s,transform .2s" style-hover="box-shadow:0 0 28px rgba(0,255,149,0.35)" style-active="transform:scale(0.98)">Los geht's</button>
    </form>

    <div aria-hidden="true" style="display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,36px);padding-top:8px;opacity:0.7">
      <div style="width:26px;height:26px;background:#6F7E9C;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/cloud.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/cloud.svg) center/contain no-repeat"></div>
      <div style="width:26px;height:26px;background:#6F7E9C;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/settings.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/settings.svg) center/contain no-repeat"></div>
      <div style="width:26px;height:26px;background:#6F7E9C;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/shield.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/shield.svg) center/contain no-repeat"></div>
      <div style="width:26px;height:26px;background:#6F7E9C;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/database.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/database.svg) center/contain no-repeat"></div>
      <div style="width:26px;height:26px;background:#6F7E9C;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/brain-circuit.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/brain-circuit.svg) center/contain no-repeat"></div>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: '' };
  renderVals() {
    const ok = this.state.name.trim().split(/\s+/).length >= 2;
    return {
      name: this.state.name,
      onName: e => this.setState({ name: e.target.value }),
      onSubmit: e => { e.preventDefault(); },
      disabled: !ok,
      btnBg: ok ? '#00FF95' : '#0A1F3D', btnFg: ok ? '#00051E' : '#A9B6D0', btnBorder: ok ? '#00FF95' : 'rgba(255,255,255,0.08)', btnCursor: ok ? 'pointer' : 'not-allowed'
    };
  }
}
</script>
</body>
</html>

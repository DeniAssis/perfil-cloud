<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#00051E;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#00FFC4;text-decoration:none}a:hover{color:#00FF95;text-decoration:underline}
</style>
</helmet>
<main data-screen-label="02 Frage 3 von 8" style="min-height:100vh;background:linear-gradient(160deg,#02122C 0%,#00051E 55%,#010E20 100%);display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:clamp(24px,5vh,48px) 20px clamp(24px,5vh,48px)">
  <div style="width:100%;max-width:720px;display:flex;flex-direction:column;gap:clamp(28px,5vh,44px);flex:1">

    <div style="display:flex;flex-direction:column;gap:14px">
      <div role="progressbar" aria-valuemin="1" aria-valuemax="8" aria-valuenow="3" aria-label="Frage 3 von 8" style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px">
        <div style="height:6px;border-radius:3px;background:#00FF95"></div>
        <div style="height:6px;border-radius:3px;background:#00FF95"></div>
        <div style="height:6px;border-radius:3px;background:#00FFC4;box-shadow:0 0 12px rgba(0,255,196,0.7),0 0 2px #00FFC4"></div>
        <div style="height:6px;border-radius:3px;background:#0A1F3D"></div>
        <div style="height:6px;border-radius:3px;background:#0A1F3D"></div>
        <div style="height:6px;border-radius:3px;background:#0A1F3D"></div>
        <div style="height:6px;border-radius:3px;background:#0A1F3D"></div>
        <div style="height:6px;border-radius:3px;background:#0A1F3D"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="font-size:12px;font-weight:600;letter-spacing:0.22em;color:#A9B6D0">HANDS-ON PROJECT DAY</span>
        <span style="font-size:14px;font-weight:600;letter-spacing:0.12em;color:#A9B6D0;font-variant-numeric:tabular-nums"><span style="color:#FFFFFF">03</span> / 08</span>
      </div>
    </div>

    <h1 style="margin:0;font-family:Sora,Inter,sans-serif;font-weight:600;font-size:clamp(20px,2.4vw,26px);line-height:1.35;letter-spacing:-0.01em;text-wrap:balance">Welche Art von Aufgabe gibt dir am ehesten das Gefühl: „Das hat sich gelohnt“?</h1>

    <div role="radiogroup" aria-label="Antworten" style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ options }}" as="o" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:16px 20px;box-sizing:border-box;text-align:left;cursor:pointer;border-radius:14px;background:{{ o.bg }};border:1px solid {{ o.border }};box-shadow:{{ o.shadow }};color:#FFFFFF;font:400 16px/1.5 Inter,system-ui,sans-serif;transition:border-color .15s,box-shadow .15s,background .15s" style-hover="border-color:#00FF95;box-shadow:0 0 0 3px rgba(0,255,149,0.15)">
          <span style="flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Sora,Inter,sans-serif;font-weight:700;font-size:15px;background:{{ o.dotBg }};color:{{ o.dotFg }};border:1px solid {{ o.dotBorder }}">{{ o.letter }}</span>
          <span style="flex:1;min-width:0;text-wrap:pretty">{{ o.text }}</span>
        </button>
      </sc-for>
    </div>

    <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:8px">
      <button type="button" style="height:52px;padding:0 24px;border-radius:12px;background:transparent;border:1px solid rgba(255,255,255,0.16);color:#FFFFFF;font:600 16px Inter,system-ui,sans-serif;cursor:pointer" style-hover="border-color:#A9B6D0;background:rgba(255,255,255,0.04)">Zurück</button>
      <button type="button" disabled="{{ nextDisabled }}" style="height:52px;padding:0 32px;border:1px solid {{ nextBorder }};border-radius:12px;background:{{ nextBg }};color:{{ nextFg }};font:600 16px Inter,system-ui,sans-serif;cursor:{{ nextCursor }};transition:box-shadow .2s,background .2s" style-hover="box-shadow:0 0 28px rgba(0,255,149,0.35)">Weiter</button>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;vorauswahl&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;keine&quot;,&quot;A&quot;,&quot;B&quot;,&quot;C&quot;,&quot;D&quot;,&quot;E&quot;],&quot;default&quot;:&quot;keine&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Zustand&quot;}}">
class Component extends DCLogic {
  state = { sel: null, order: [0,1,2,3,4].map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]) };
  componentDidMount() { const p = this.props.vorauswahl; if (p && p !== 'keine') this.setState({ sel: 'ABCDE'.indexOf(p) }); }
  componentDidUpdate(prev) { if (prev.vorauswahl !== this.props.vorauswahl) { const p = this.props.vorauswahl; this.setState({ sel: p && p !== 'keine' ? 'ABCDE'.indexOf(p) : null }); } }
  renderVals() {
    const texts = [
      'Eine Lösung schaffen, die auch dann konsistent bleibt, wenn sich die Umgebung ändert.',
      'Eine Routine voller manueller Schritte in einen automatischen, wiederholbaren Ablauf verwandeln.',
      'Eine Bedingung finden und entschärfen, die Raum für einen Vorfall hätte öffnen können.',
      'Einen Weg finden, Verschwendung zu reduzieren, ohne die Lieferung zu beeinträchtigen.',
      'Ein relevantes Muster in Daten entdecken und es in etwas Nützliches für das Geschäft verwandeln.'
    ];
    const sel = this.state.sel;
    const options = this.state.order.map((k, i) => { const text = texts[k];
      const on = sel === i;
      return {
        letter: 'ABCDE'[i], text, checked: on ? 'true' : 'false',
        pick: () => this.setState({ sel: i }),
        bg: on ? 'rgba(0,255,149,0.06)' : '#0A1F3D',
        border: on ? '#00FF95' : 'rgba(255,255,255,0.08)',
        shadow: on ? '0 0 0 3px rgba(0,255,149,0.15)' : 'none',
        dotBg: on ? '#00FF95' : 'transparent',
        dotFg: on ? '#00051E' : '#A9B6D0',
        dotBorder: on ? '#00FF95' : 'rgba(169,182,208,0.4)'
      };
    });
    const ok = sel !== null;
    return { options, nextDisabled: !ok, nextBg: ok ? '#00FF95' : '#0A1F3D', nextFg: ok ? '#00051E' : '#A9B6D0', nextBorder: ok ? '#00FF95' : 'rgba(255,255,255,0.08)', nextCursor: ok ? 'pointer' : 'not-allowed' };
  }
}
</script>
</body>
</html>

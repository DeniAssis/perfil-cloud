<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Test: Dimension außerhalb des DOM</title>
</head>
<body>
<!-- Über den lokalen Server öffnen: http://127.0.0.1:8000/tests/sem-dim-no-dom.html -->
<pre id="saida">läuft …</pre>
<iframe id="app" src="../index.html" style="width:420px;height:900px"></iframe>
<script type="module">
// Vollständige Namen statt Einzelwörter: „Automatisierungen“ kommt als normales Wort in Antworttexten vor.
const PROIBIDOS = ['multicloud', 'devops', 'security', 'finops', 'data_ai', 'data-dim', 'daten & ki', 'daten &amp; ki'];
const falhas = [];
const log = [];
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const verificar = (doc, etapa) => {
  const html = doc.documentElement.outerHTML.toLowerCase();
  for (const p of PROIBIDOS) if (html.includes(p)) falhas.push(`${etapa}: DOM enthält „${p}“`);
  for (const el of doc.querySelectorAll('*')) {
    for (const a of el.attributes) if (a.name.startsWith('data-')) falhas.push(`${etapa}: Attribut ${a.name}`);
  }
};
const checar = (cond, msg) => { if (!cond) falhas.push(msg); };

const frame = document.getElementById('app');
await new Promise((r) => frame.addEventListener('load', r, { once: true }));
const doc = frame.contentDocument;
const $ = (id) => doc.getElementById(id);

verificar(doc, 'Start');
const nome = $('nome');
nome.value = 'Denise';
nome.dispatchEvent(new Event('input'));
checar($('btn-comecar').disabled, '„Los geht’s“ ist mit nur einem Wort aktiv');
nome.value = 'Denise Assis';
nome.dispatchEvent(new Event('input'));
checar(!$('btn-comecar').disabled, '„Los geht’s“ ist trotz gültigem Namen gesperrt');
$('btn-comecar').click();
for (let t = 0; t < 50 && $('tela-quiz').hidden; t++) await espera(50);
checar(!$('tela-quiz').hidden, 'Quizbildschirm wurde nicht geöffnet');

const escolhas = [];
for (let i = 0; i < 8; i++) {
  verificar(doc, `Frage ${i + 1} vorher`);
  checar($('quiz-atual').textContent === String(i + 1).padStart(2, '0'), `falscher Zähler bei Frage ${i + 1}`);
  checar($('quiz-progresso').children.length === 8, 'Fortschrittsbalken hat keine 8 Segmente');
  checar($('btn-proxima').disabled, `„Weiter“ ist ohne Auswahl aktiv (Frage ${i + 1})`);
  const opcoes = $('quiz-opcoes').children;
  checar(opcoes.length === 5, `Frage ${i + 1} hat keine 5 Optionen`);
  const n = Math.floor(Math.random() * 5);
  escolhas.push(opcoes[n].querySelector('.opcao-texto').textContent);
  opcoes[n].click();
  checar(!$('btn-proxima').disabled, `„Weiter“ ist nach Auswahl gesperrt (Frage ${i + 1})`);
  verificar(doc, `Frage ${i + 1} nachher`);
  if (i === 3) {
    $('btn-proxima').click();
    $('btn-voltar').click();
    const marcada = doc.querySelector('#quiz-opcoes [aria-checked="true"] .opcao-texto');
    checar(marcada && marcada.textContent === escolhas[3], 'Antwort war nach „Zurück“ nicht mehr markiert');
  }
  // Das letzte „Weiter“ öffnet das Ergebnis, dort dürfen Dimensionen erscheinen.
  $('btn-proxima').click();
}
checar(!$('tela-resultado').hidden, 'Ergebnis wurde nach 8 Antworten nicht geöffnet');

log.push(falhas.length ? 'FEHLER' : 'OK');
document.getElementById('saida').textContent = [...log, ...falhas].join('\n');
document.title = falhas.length ? 'FEHLER' : 'OK';
</script>
</body>
</html>

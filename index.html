<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qual é o seu perfil Cloud? · Hands-on Project Day 2026</title>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="module" src="./src/quiz.js"></script>
</head>
<body>
  <main>
    <section id="tela-inicio" class="tela tela-inicio" aria-labelledby="inicio-titulo">
      <div class="decor" aria-hidden="true">
        <div class="decor-predios">
          <span style="--w:28px;--h:60px"></span>
          <span style="--w:40px;--h:110px"></span>
          <span style="--w:24px;--h:80px"></span>
          <span style="--w:46px;--h:140px"></span>
          <span style="--w:30px;--h:70px"></span>
        </div>
        <span class="decor-colina decor-colina-1"></span>
        <span class="decor-colina decor-colina-2"></span>
        <span class="decor-colina decor-colina-3"></span>
        <span class="decor-fade"></span>
      </div>

      <div class="inicio-conteudo">
        <img class="inicio-logo" src="./assets/logo-tcb.svg" alt="The Cloud Bootcamp" width="211" height="87">

        <div class="inicio-cabecalho">
          <p class="evento">
            <span class="eyebrow">HANDS-ON PROJECT DAY</span>
            <span class="evento-divisor"></span>
            <span class="evento-ano">2026</span>
          </p>
          <h1 id="inicio-titulo" class="inicio-titulo" tabindex="-1">Qual é o seu perfil Cloud?</h1>
          <p class="inicio-sub">8 perguntas, menos de 3 minutos.<br>Não existem respostas certas ou erradas.</p>
        </div>

        <form id="form-inicio" class="form-inicio" novalidate>
          <label for="nome" class="eyebrow eyebrow-muted">NOME E SOBRENOME</label>
          <input id="nome" name="nome" type="text" class="campo" autocomplete="name" placeholder="ex.: Rafael Souza" maxlength="60" required>
          <button id="btn-comecar" type="submit" class="btn btn-primario" disabled>Começar</button>
          <p id="inicio-erro" class="erro" role="alert" hidden></p>
        </form>
      </div>
    </section>

    <section id="tela-quiz" class="tela tela-quiz" aria-labelledby="quiz-pergunta" hidden>
      <div class="quiz">
        <header class="quiz-topo">
          <div id="quiz-progresso" class="progresso" role="progressbar" aria-valuemin="1"></div>
          <div class="quiz-meta">
            <span class="eyebrow eyebrow-muted">HANDS-ON PROJECT DAY</span>
            <span class="contador"><span id="quiz-atual" class="contador-atual">01</span> / <span id="quiz-total">08</span></span>
          </div>
        </header>

        <h1 id="quiz-pergunta" class="quiz-pergunta" tabindex="-1"></h1>

        <div id="quiz-opcoes" class="opcoes" role="radiogroup" aria-labelledby="quiz-pergunta"></div>

        <nav class="quiz-nav" aria-label="Navegação do quiz">
          <button id="btn-voltar" type="button" class="btn btn-secundario">Voltar</button>
          <button id="btn-proxima" type="button" class="btn btn-primario" disabled>Próxima</button>
        </nav>
      </div>
    </section>

    <section id="tela-resultado" class="tela tela-resultado" aria-labelledby="resultado-titulo" hidden>
      <div class="resultado">
        <div class="resultado-perfil">
          <p class="eyebrow eyebrow-muted">SEU PERFIL CLOUD É</p>
          <h1 id="resultado-titulo" class="resultado-titulo" tabindex="-1"></h1>
          <div class="pill-afinidade">
            <span id="pill-icone" class="pill-icone" aria-hidden="true"></span>
            <span class="pill-divisor"></span>
            <span class="pill-textos">
              <span id="pill-rotulo" class="pill-rotulo"></span>
              <span id="pill-perfil" class="pill-perfil"></span>
            </span>
          </div>
          <p id="resultado-complementar" class="resultado-complementar" hidden></p>
        </div>

        <figure class="resultado-radar">
          <div id="radar-pagina" class="radar-pagina" role="img"></div>
          <figcaption>
            <ul id="resultado-pontos" class="resultado-pontos"></ul>
          </figcaption>
        </figure>

        <div class="resultado-cracha">
          <div class="resultado-cracha-titulo">
            <p class="eyebrow eyebrow-muted">SEU CRACHÁ VIRTUAL</p>
            <h2>Compartilhe com sua rede</h2>
          </div>
          <div id="cracha-preview" class="cracha-preview" role="img" aria-label="Prévia do crachá"></div>
          <div class="resultado-acoes">
            <button id="btn-baixar" type="button" class="btn btn-primario">Baixar crachá (PNG)</button>
            <button id="btn-refazer" type="button" class="btn btn-secundario">Refazer o quiz</button>
          </div>
          <p id="resultado-erro" class="erro" role="alert" hidden></p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
